# Builds the Shiny app as a WebAssembly (shinylive) site and deploys it to
# GitHub Pages. Derived from
# https://github.com/posit-dev/r-shinylive/tree/actions-v1/examples
#
# One-off setup: repository Settings > Pages > Build and deployment >
# Source = "GitHub Actions".
name: Deploy app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  shinylive:
    uses: posit-dev/r-shinylive/.github/workflows/deploy-app.yaml@actions-v1
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from this repository
